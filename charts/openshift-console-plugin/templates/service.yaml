apiVersion: v1
kind: Service
metadata:
  {{- if not .Values.plugin.certificateSecretName }}
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: {{ template "openshift-console-plugin.certificateSecret" . }}
  {{- end }}
  name: {{ template "openshift-console-plugin.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshift-console-plugin.labels" . | nindent 4 }}
spec:
  ports:
    - name: {{ include "openshift-console-plugin.port" . }}-tcp
      protocol: TCP
      port: {{ include "openshift-console-plugin.port" . }}
      targetPort: {{ include "openshift-console-plugin.port" . }}
  selector:
    {{- include "openshift-console-plugin.selectorLabels" . | nindent 4 }}
  type: ClusterIP
  sessionAffinity: None
