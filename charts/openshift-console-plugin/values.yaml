---
# For development and the lab only; see README.md. Clusters install the plugin through LibreDB Studio's chart or
# operator. The console is told to load the plugin by hand (oc patch), so this chart holds no Job and no cluster role.
plugin:
  name: libredb-studio
  description: LibreDB Studio
  image: ""
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  replicas: 2
  securityContext:
    enabled: true
  podSecurityContext:
    enabled: true
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    enabled: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
  resources:
    requests:
      cpu: 10m
      memory: 50Mi
  certificateSecretName: ""
  serviceAccount:
    annotations: {}
