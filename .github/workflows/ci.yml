name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Typecheck and Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Yarn 4 comes through Corepack, which setup-node needs for its yarn cache.
      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      # .yarnrc.yml sets enableScripts: false, so no dependency install script runs.
      - name: Install from the lockfile
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      # The unit tests render the development chart, and fail under CI when helm is missing.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.3

      - name: Lint the development chart
        run: helm lint charts/openshift-console-plugin --strict

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests with the 100% line coverage gate
        run: yarn test:coverage

      # git status, not git diff, so a new locale file the extraction writes fails the check too.
      - name: Locale file matches the extracted strings
        run: |
          set -euo pipefail
          yarn i18n
          changed="$(git status --porcelain --untracked-files=all -- locales)"
          if [ -n "$changed" ]; then
            echo "::error::The locale files are not up to date: run yarn i18n and commit the result." >&2
            echo "$changed" >&2
            exit 1
          fi

  # The connection id fixture is Studio's own file, copied byte for byte from the released Studio
  # tag its source file names, so the plugin and Studio cannot drift apart unnoticed.
  golden-fixture:
    name: Golden Fixture Matches Studio
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the fixture with the file at the Studio tag
        run: |
          set -euo pipefail
          source=tests/unit/fixtures/kubernetes-discovery-golden.source.json
          url="https://raw.githubusercontent.com/$(jq -r .repository "$source")/$(jq -r .tag "$source")/$(jq -r .path "$source")"
          curl -fsSL --retry 3 "$url" -o "$RUNNER_TEMP/studio-golden.json"
          cmp "$RUNNER_TEMP/studio-golden.json" tests/unit/fixtures/kubernetes-discovery-golden.json

  build:
    name: Build and Plugin Manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install from the lockfile
        run: yarn install --immutable

      - name: Build the plugin
        run: yarn build

      - name: Check the plugin manifest
        run: yarn test:manifest

  # The image the release workflow publishes: both platforms build (the runtime stage has no RUN, so no emulator is
  # set up), and the amd64 image runs the smoke test, which proves TLS, the content types, the read-only root and
  # that no token reaches the access log.
  image:
    name: Image and nginx Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The builder runs privileged, so its image is pinned by digest (v0.33.1 is the action's default
      # buildx-stable-1 on 2026-10-30); Dependabot does not track it, and release.yml pins the same one.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: Read the version
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Build both platforms without pushing
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: docker buildx build --platform linux/amd64,linux/arm64 --build-arg VERSION="$VERSION" .

      - name: Load the amd64 image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: docker buildx build --platform linux/amd64 --load --build-arg VERSION="$VERSION" --tag localhost/osplugin:ci .

      - name: Smoke-test the image
        run: scripts/nginx-smoke.sh localhost/osplugin:ci
