# The plugin's asset server. The console forwards each user's bearer token on every asset fetch, so the access log
# keeps the method, the path without its query string and the status, and never a header, a cookie or the query.
# The container runs with a read-only root: the logs go to the standard streams and every writable path is in /tmp.
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {}

http {
  log_format plugin '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';
  access_log /dev/stdout plugin;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  keepalive_timeout 65;

  server {
    listen 9443 ssl;
    listen [::]:9443 ssl;
    ssl_certificate /var/cert/tls.crt;
    ssl_certificate_key /var/cert/tls.key;
    # nginx 1.20 enables TLS 1.0 and 1.1 and leaves out TLS 1.3 unless told otherwise.
    ssl_protocols TLSv1.2 TLSv1.3;

    # The build output only: the base image's welcome and error pages in /usr/share/nginx/html are not served.
    root /usr/share/nginx/plugin;
    location / {
      try_files $uri =404;
    }
  }
}
